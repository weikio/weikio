- route:
    id: export-invoices
    from:
      uri: "file:{{invoice-inbox}}?include=.*\\.json&move=.done"
      steps:
        - setHeader:
            name: Content-Type
            constant: application/json
        - setHeader:
            name: Authorization
            simple: "Bearer {{erp-api-key}}"
        - to: "{{erp-url}}/api/invoices"
        - to: micrometer:counter:invoices_processed
        - to: "kamelet:weikio-event-sink?channel=invoice-created"
