name: Feature request
description: Ask for something Weik.io doesn't do yet.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The job you're trying to get done, and where Weik.io stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like Weik.io to do
      description: The command, the screen or the document you have in mind.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release
      description: The release that `weikio version` prints.
      placeholder: "2026.2.1"
