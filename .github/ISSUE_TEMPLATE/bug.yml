name: Bug report
description: Report a bug in Weik.io.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report a vulnerability as SECURITY.md describes, never in an issue. Remove secrets from everything you paste here.
  - type: input
    id: release
    attributes:
      label: Release
      description: The release that `weikio version` prints.
      placeholder: "2026.2.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or the clicks, in order.
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What you saw
      description: The message, the log lines or a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to see
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of weikio-backend doctor
      description: For a problem on the hub.
      render: text
